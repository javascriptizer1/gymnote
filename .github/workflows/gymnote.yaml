name: Deploy Gymnote Bot

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the service"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_target:
        description: "Deployment target"
        required: true
        default: "both"
        type: choice
        options:
          - "vps-ru"
          - "vps-foreign"
          - "both"

env:
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.5

      - name: Build binary
        run: |
          go mod download
          go build -o ./bin ./cmd/gymnote/main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymnote-binary
          path: ./bin

  deploy-vps-ru:
    runs-on: ubuntu-latest
    environment: production
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.deploy == 'true' && 
      (github.event.inputs.deploy_target == 'vps-ru' || github.event.inputs.deploy_target == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: gymnote-binary
          path: ./bin

      - name: Create .env file for RU VPS (VK bot enabled)
        run: |
          echo "ENV=${{ vars.ENV }}" >> .env
          echo "GRACEFUL_TIMEOUT=${{ vars.GRACEFUL_TIMEOUT }}" >> .env

          echo "TELEGRAM_ENABLED=false" >> .env
          echo "VK_ENABLED=true" >> .env

          echo "VK_ACCESS_TOKEN=${{ secrets.VK_ACCESS_TOKEN }}" >> .env
          echo "VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}" >> .env
          echo "VK_GRAPHICS_PATH=${{ vars.VK_GRAPHICS_PATH }}" >> .env
          echo "VK_AUTHOR_NAME=${{ vars.VK_AUTHOR_NAME }}" >> .env
          echo "VK_AUTHOR_ID=${{ secrets.VK_AUTHOR_ID }}" >> .env

          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

          echo "REDIS_ADDRESS=${{ secrets.REDIS_ADDRESS }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "REDIS_DB=${{ secrets.REDIS_DB }}" >> .env

      - name: Set up SSH Key for RU VPS
        run: |
          echo "${{ secrets.VPS_RU_SSH_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

      - name: Deploy to RU VPS
        env:
          VPS_USER: ${{ secrets.VPS_RU_USER }}
          VPS_HOST: ${{ secrets.VPS_RU_HOST }}
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/apps/gymnote/"

          scp -i deploy_key.pem -o StrictHostKeyChecking=no .env $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/.env
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "chmod 600 /home/$VPS_USER/apps/gymnote/.env"

          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo systemctl stop gymnote.service || true"

          chmod +x ./bin/bin
          scp -i deploy_key.pem -o StrictHostKeyChecking=no ./bin/bin $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/bin
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "chmod +x /home/$VPS_USER/apps/gymnote/bin"

          scp -i deploy_key.pem -o StrictHostKeyChecking=no deploy/vps/gymnote.ini $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/gymnote.ini
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo mv /home/$VPS_USER/apps/gymnote/gymnote.ini /etc/systemd/system/gymnote.service && sudo systemctl daemon-reload && sudo systemctl restart gymnote.service && sudo systemctl status gymnote.service"

  deploy-vps-foreign:
    runs-on: ubuntu-latest
    environment: production
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.deploy == 'true' && 
      (github.event.inputs.deploy_target == 'vps-foreign' || github.event.inputs.deploy_target == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: gymnote-binary
          path: ./bin

      - name: Create .env file for Foreign VPS (Telegram bot enabled)
        run: |
          echo "ENV=${{ vars.ENV }}" >> .env
          echo "GRACEFUL_TIMEOUT=${{ vars.GRACEFUL_TIMEOUT }}" >> .env

          echo "TELEGRAM_ENABLED=true" >> .env
          echo "VK_ENABLED=false" >> .env

          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_BOT_TIMEOUT=${{ vars.TELEGRAM_BOT_TIMEOUT }}" >> .env
          echo "TELEGRAM_BOT_DEBUG=${{ vars.TELEGRAM_BOT_DEBUG }}" >> .env
          echo "TELEGRAM_BOT_GRAPHICS_PATH=${{ vars.TELEGRAM_BOT_GRAPHICS_PATH }}" >> .env
          echo "TELEGRAM_BOT_GREETING_STICKER_ID=${{ vars.TELEGRAM_BOT_GREETING_STICKER_ID }}" >> .env
          echo "TELEGRAM_BOT_AUTHOR_NAME=${{ vars.TELEGRAM_BOT_AUTHOR_NAME }}" >> .env

          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

          echo "REDIS_ADDRESS=${{ secrets.REDIS_ADDRESS }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "REDIS_DB=${{ secrets.REDIS_DB }}" >> .env

      - name: Set up SSH Key for Foreign VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

      - name: Deploy to Foreign VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/apps/gymnote/"

          scp -i deploy_key.pem -o StrictHostKeyChecking=no .env $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/.env
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "chmod 600 /home/$VPS_USER/apps/gymnote/.env"

          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo systemctl stop gymnote.service || true"

          chmod +x ./bin/bin
          scp -i deploy_key.pem -o StrictHostKeyChecking=no ./bin/bin $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/bin
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "chmod +x /home/$VPS_USER/apps/gymnote/bin"

          scp -i deploy_key.pem -o StrictHostKeyChecking=no deploy/vps/gymnote.ini $VPS_USER@$VPS_HOST:/home/$VPS_USER/apps/gymnote/gymnote.ini
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo mv /home/$VPS_USER/apps/gymnote/gymnote.ini /etc/systemd/system/gymnote.service && sudo systemctl daemon-reload && sudo systemctl restart gymnote.service && sudo systemctl status gymnote.service"
